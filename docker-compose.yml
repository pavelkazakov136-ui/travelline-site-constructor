services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: siteconstructor
    ports:
      - "5432:5432"         
    volumes:
      - pgdata:/var/lib/postgresql/data   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siteconstructor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .            
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=siteconstructor;Username=postgres;Password=dev"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "5272:8080"       
    depends_on:
      db:
        condition: service_healthy   

volumes:
  pgdata: