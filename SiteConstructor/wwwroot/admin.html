<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <link rel="stylesheet" href="adminStyles.css" />
  <title>Админка — TL:TECH</title>
</head>
<body>

  <aside class="sidebar">
    <nav>
      <a href="#hero">Hero</a>
      <a href="#team">Команда</a>
      <a href="#vacancies">Вакансии</a>
      <a href="#clients">Клиенты</a>
      <a href="#gallery">Галерея</a>
      <a href="#bonuses">Плюшки</a>
      <a href="#form-section">Форма</a>
    </nav>
  </aside>
  <main>
    <h1>Админ-панель</h1>
    <button id="logout-btn">Выйти</button>

    <section id="hero">
      <h2>Hero</h2>
      <label>Подзаголовок
        <textarea id="hero-subtitle" rows="3"></textarea>
      </label>

      <h3>Статистика</h3>
      <div id="hero-stats"></div>
      <button id="add-stat" class="secondary">+ добавить статистику</button>

      <button id="save-hero">Сохранить Hero</button>
      <p id="hero-msg"></p>
    </section>
    
    <section id="team">
      <h2>Карточки команды</h2>
      <div id="team-cards"></div>
      <button id="add-member" class="secondary">+ добавить сотрудника</button>
      <p id="team-msg"></p>
    </section>
    
    <section id="vacancies">
      <h2>Вакансии</h2>
      <div id="vacancy-cards"></div>
      <button id="add-vacancy" class="secondary">+ добавить вакансию</button>
      <p id="vacancy-msg"></p>
    </section>

    <section id="clients">
      <h2>Клиенты</h2>
      <div id="client-cards"></div>
      <button id="add-client" class="secondary">+ добавить клиента</button>
      <p id="client-msg"></p>
    </section>

    <section id="gallery">
      <h2>Галерея</h2>
      <div id="gallery-cards"></div>
      <button id="add-gallery-item" class="secondary">+ добавить пост</button>
      <p id="gallery-msg"></p>
    </section>

    <section id="bonuses">
      <h2>Плюшки и все такое</h2>
      <div id="bonuses-cards"></div>
      <button id="add-bonus" class="secondary">+ добавить бонус</button>
      <p id="bonus-msg"></p>
    </section>

    <section id="form-section">
      <h2>Форма</h2>
      <div id="form"></div>
      <button id="add-form"> сохранить форму</button>
      <p id="form-msg"></p>
    </section>

  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/admin_hero.js"></script>
  <script src="/js/admin_team.js"></script>
  <script src="/js/admin_vacancies.js"></script>
  <script src="/js/admin_clients.js"></script>
  <script src="/js/admin_gallery.js"></script>
  <script src="/js/admin_bonuses.js"></script>
  <script src="/js/admin_form.js"></script>
</body>
</html>
