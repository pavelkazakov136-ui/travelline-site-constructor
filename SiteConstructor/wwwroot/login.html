<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
  <link rel="stylesheet" href="adminStyles.css" />
</head>
<body>
  <main>
    <article style="max-width: 400px; margin: 10vh auto;">
      <h1>Вход в админку</h1>

      <label>Логин
        <input type="text" id="username" autocomplete="username" autofocus>
      </label>

      <label>Пароль
        <input type="password" id="password" autocomplete="current-password">
      </label>

      <button id="login-btn" style="display: block; margin: 0 auto;">Войти</button>
      <p id="login-msg" style="text-align: center;"></p>
    </article>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
